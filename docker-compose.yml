version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: meet@123
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    working_dir: /app      # 👈 ensures code runs from mounted folder
    depends_on: 
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app             # 👈 sync local code with container
      # db-data:/var/lib/postgresql/data   
    command: python manage.py runserver 0.0.0.0:8000

volumes:
  db-data:
